  <title>AUTOGRIGOREAN | Evidența elevilor</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:#13233c;background:#f4f7fc;font-synthesis:none;--navy:#10243e;--blue:#2466c5;--edge:#dae2ef;--muted:#67768b;--green:#117449;--red:#bd3541;--yellow:#d39a26}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;-webkit-tap-highlight-color:transparent}body{padding-bottom:env(safe-area-inset-bottom)}button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:not-allowed}a{color:var(--blue)}:focus-visible{outline:3px solid #7ab0ff;outline-offset:2px}
    header{background:var(--navy);color:white;padding:calc(env(safe-area-inset-top) + 16px) max(16px,env(safe-area-inset-right)) 15px max(16px,env(safe-area-inset-left));position:sticky;top:0;z-index:5;box-shadow:0 3px 14px #13233c20}
    .header-row{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1050px;margin:auto}.brand{display:flex;align-items:center;gap:11px;min-width:0}.logo{background:#fff2;color: #fff;border-radius:14px;padding:10px;font-size:24px;line-height:1}.brand-name{font-size:20px;font-weight:850;letter-spacing:.5px}.brand-sub{font-size:11px;color:#bbcce4;margin-top:3px}.header-actions{display:flex;gap:6px}.icon-btn{border:1px solid #ffffff38;background:#ffffff16;color:#fff;border-radius:12px;min-width:43px;height:43px;font-size:20px}
    main{width:min(1050px,100%);padding:16px 14px 80px;margin:auto}.tab-wrap{overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px 6px}.tab-wrap::-webkit-scrollbar{display:none}.tabs{display:flex;gap:8px;width:max-content}.tab{border:1px solid var(--edge);background:#fff;color:#34465e;border-radius:14px;padding:12px 14px;font-size:13px;font-weight:750;white-space:nowrap}.tab.active{background:#225bb1;color:#fff;border-color:#225bb1}.tab .count{opacity:.75;font-size:11px;padding-left:3px}
    .heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 0 14px}h1{font-size:23px;line-height:1.1;margin:0}h2{font-size:17px;margin:0}.subtle{font-size:13px;color:var(--muted);margin-top:5px}.primary{border:0;border-radius:12px;background:#2466c5;color:white;font-weight:750;padding:12px 15px;min-height:44px}.secondary{border:1px solid #cdd9ed;background:#fff;color:#24416d;border-radius:12px;font-weight:700;padding:10px 13px;min-height:42px}.danger{color:#b52c37;border-color:#f1c5ca}.success{background:#117449;color:white;border-color:#117449}.small{padding:8px 10px;min-height:36px;font-size:13px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:15px}.stat{padding:15px;border-radius:16px;background:#fff;border:1px solid var(--edge)}.stat .value{font-size:28px;font-weight:850;margin-top:4px}.stat .label{font-size:12px;color:var(--muted)}.stats.three{grid-template-columns:repeat(3,minmax(0,1fr))}
    .search-line{display:flex;gap:9px;margin-bottom:14px}.search-line input{flex:1;min-width:0;border:1px solid #cbd8ec;border-radius:12px;background:white;padding:12px 13px;font-size:16px;outline:none}.search-line input:focus{border-color:#3679d5}.search-line .secondary{white-space:nowrap}.row-card{background:#fff;border:1px solid var(--edge);border-radius:17px;padding:14px 14px 12px;margin:0 0 10px;box-shadow:0 2px 8px #1c3a6406}.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:9px}.student-name{font-size:16px;font-weight:800;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted);line-height:1.65;margin-top:4px}.chip{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:750;margin:4px 4px 0 0;background:#eef3fb;color:#35557e}.chip.blue{background:#e7efff;color:#2156a3}.chip.green{background:#d9f4e5;color:#116742}.chip.red{background:#ffebee;color:#a32c3a}.chip.black{background:#e8e8eb;color:#222}.chip.gold{background:#fff0cf;color:#976300}.chips{margin-top:6px}.card-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.card-actions button{flex:1 1 auto}.empty{padding:36px 20px;text-align:center;color:var(--muted);border:1px dashed #bdcce0;border-radius:17px;background:white}.empty b{display:block;color:#20344c;font-size:17px;margin-bottom:8px}.legend{font-size:12px;color:#576a82;line-height:1.9;margin-top:18px}.legend span{white-space:nowrap;margin-right:12px}
    dialog{border:0;padding:0;border-radius:22px;width:min(540px,calc(100% - 18px));max-height:calc(100dvh - 30px);box-shadow:0 16px 70px #10243e55;color:#162942;background:#fff}dialog::backdrop{background:#0b1939ad}dialog[open]{display:flex;flex-direction:column}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--edge);padding:17px 18px}.modal-content{padding:16px 18px;overflow:auto;overscroll-behavior:contain}.modal-footer{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;border-top:1px solid var(--edge);padding:13px 18px calc(13px + env(safe-area-inset-bottom))}.close{border:0;background:#edf1f7;border-radius:12px;width:37px;height:37px;font-size:20px;flex-shrink:0}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:6px}.field input,.field textarea,.field select{border:1px solid #cfdaeb;border-radius:11px;padding:11px 12px;width:100%;background:#fff;min-height:44px;font-size:16px;color:#13233c}.field textarea{min-height:70px;resize:vertical}.field input[type=checkbox]{width:22px;min-height:22px;margin:0}.checklabel{display:flex;align-items:center;gap:10px}.hint{font-size:12px;color:var(--muted);margin:6px 0 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hr{height:1px;background:var(--edge);margin:16px 0}.session-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#f4f7fc;padding:9px 10px;border-radius:11px;margin:6px 0}.session-date{background:#fff;border:1px solid #cbd8e9;border-radius:10px;padding:9px 12px;font-weight:700;color:#244d80}.session-list{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}.session-pill{background:#eef3fb;border:1px solid #cee0f5;border-radius:10px;padding:9px 12px;color:#2455a2;font-weight:750}.preview-photo{max-height:45dvh;max-width:100%;object-fit:contain;display:block;margin:10px auto;border-radius:10px;background:#eef1f6}.photo-full{width:100%;height:auto;max-height:70dvh;object-fit:contain}.file-input{padding:10px;background:#f5f8ff;border-radius:11px;border:1px dashed #b5c9e9;width:100%}.notice{font-size:12px;color:#62748b;line-height:1.6}.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:min(440px,90vw);border-radius:14px;padding:12px 18px;background:#132b4e;color:#fff;box-shadow:0 9px 25px #172c4a45;z-index:12;font-size:14px;display:none}.toast.show{display:block}.offline{color:#b8ffdd;font-size:12px;font-weight:700}.settings-row{display:flex;flex-wrap:wrap;gap:9px;margin:10px 0 15px}.year-selector{display:flex;align-items:center;gap:7px;color:#6a7a90;font-size:12px}.year-selector select{border:1px solid var(--edge);background:white;border-radius:9px;padding:8px;color:#34465e}.tag{font-size:11px;border:1px solid #d2ddec;border-radius:9px;padding:4px 7px;background:#fafcff}.section-note{font-size:13px;color:#60748d;margin-top:-5px;margin-bottom:13px}.hidden{display:none!important}
    @media(min-width:760px){.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.row-card{margin:0}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stats.three{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:360px){.brand-name{font-size:17px}.stat{padding:10px}.stat .value{font-size:23px}.primary{padding:10px}.heading{gap:5px}h1{font-size:21px}}
  </style>

<body>
<header><div class="header-row"><div class="brand"><div class="logo" aria-hidden="true">🚗</div><div><div class="brand-name">AUTOGRIGOREAN</div><div class="brand-sub">Evidența elevilor · <span id="connection">disponibilă offline</span></div></div></div><div class="header-actions"><button type="button" class="icon-btn" id="backupButton" aria-label="Backup și setări" title="Backup și setări">⚙️</button></div></div></header>
<main><nav class="tab-wrap" aria-label="Etapele elevilor"><div class="tabs" id="tabs"></div></nav><div class="heading"><div><h1 id="pageTitle">TRASEU</h1><div class="subtle" id="pageSubtitle"></div></div><button class="primary" id="addStudent">+ Elev</button></div><div id="stats"></div><div id="note" class="section-note"></div><div class="search-line"><input id="search" type="search" placeholder="Caută în toate evidențele…" autocomplete="off" aria-label="Caută elev"/><button class="secondary" id="clearSearch" title="Șterge căutarea" aria-label="Șterge căutarea">✕</button></div><div id="toolbar"></div><section class="cards" id="cards" aria-live="polite"></section><div class="legend"><span>🔵 Respins anterior</span><span>⚫ Programat</span><span>🟢 Promovat</span><span>💰 Dosar achitat</span><span>💸 Plată neconfirmată</span></div></main>
