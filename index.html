function details(p){modal('Detalii elev',`<p><b>${esc(p.name)}</b></p><p class="meta">An înscriere: ${p.enrollYear}<br>Traseu: ${nice(p.exam)}<br>Mutat: ${nice(p.movedAt)}<br>Încercări: ${p.attempts}<br>Ședințe: ${p.lessons.map(nice).join(', ')||'Niciuna'}<br>Plată: ${p.paid?'Achitat':'Neconfirmat'}<br>${esc(p.medical)}<br>${esc(p.notes)}</p>`,()=>{},'Închide')}
$('#list').onclick=e=>{let b=e.target.closest('[data-act]');if(!b)return;let p=people.find(x=>String(x.id)===b.dataset.id);if(!p)return;let a=b.dataset.act;if(a==='examedit'){editExam(p);return}if(a==='remove-traseu'){if(confirm('Scoți pe '+p.name+' din TRASEU? Elevul rămâne în DOSARE cu toate informațiile.')){move(p,'inscris');p.exam='';persist()}return}if(a==='delete'){if(tab!=='dosare'&&tab!=='extern'){if(confirm('Scoți elevul din această secțiune? Fișa rămâne în DOSARE.')){move(p,'inscris');persist()}return}if(confirm('Ștergi definitiv elevul '+p.name+' și toate informațiile sale?')){people=people.filter(x=>x!==p);persist()}return}if(a==='edit')edit(p);if(a==='lesson')lesson(p);if(a==='sala')sala(p);if(a==='traseu')traseu(p);if(a==='admis'||a==='respins')result(p,a==='admis'?'admisi':'respinsi');if(a==='details')details(p);if(a==='restore'){if(confirm('Muți elevul înapoi în DOSARE?')){move(p,'inscris');persist()}}};$('#add').onclick=()=>edit(null);
$('#export').onclick=()=>{let blob=new Blob([JSON.stringify(people,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='AUTOGRIGOREAN_backup_'+now()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#import').onclick=()=>$('#upload').click();$('#upload').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data)){if(Array.isArray(data.people))data=data.people;else throw Error()};if(confirm('Înlocuiești lista curentă cu lista din copia de siguranță?')){people=data.map((p,i)=>({...p,enrollYear:Number(p.enrollYear)||2026,order:Number(p.order)||Number(p.id)||i,history:p.history||[],lessons:p.lessons||[],idPhotos:p.idPhotos||[]}));classifyExtern();persist()}}catch{alert('Fișier JSON invalid')}e.target.value=''};render();
})().catch(err=>{console.error(err);alert('AUTOGRIGOREAN nu a putut inițializa stocarea. Exportă copia de siguranță și reîncarcă aplicația.')});
</script>
